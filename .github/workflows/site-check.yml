name: Website validation

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
      - name: Install Ruby and Jekyll dependencies
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Build site
        run: bundle exec jekyll build --trace
      - name: Check landing links and assets
        run: python3 scripts/check_landing_links.py _site
      - name: Install browser test dependencies
        run: python3 -m pip install --user playwright==1.56.0
      - name: Smoke-test desktop and mobile
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory _site >/tmp/kaniop-http.log 2>&1 &
          python3 scripts/check_landing_browser.py
      - name: Upload landing screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: landing-screenshots
          path: screenshots/
          if-no-files-found: ignore
